<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{DOCUMENT_TITLE}}</title>
    <link rel="stylesheet" href="{{STYLES_HREF}}" />
  </head>
  <body>
    <main class="letter-shell" aria-label="Cover letter preview">
      <article class="cover-letter">
        <header class="cover-letter-header">
          <section class="cover-contact" aria-label="Contact information">
            <h1>{{NAME}}</h1>
            <p>{{CONTACT_LINES}}</p>
          </section>
        </header>

        <section class="cover-letter-body">
          <h2>
            Application for the position of <span>{{ROLE}}</span> at
            <span>{{COMPANY}}</span>
          </h2>

          <p>{{SALUTATION}}</p>

          {{BODY_PARAGRAPHS}}

          <div class="cover-signoff">
            <p>{{SIGNOFF}}</p>
            <p>{{NAME}}</p>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
